.qty{display:flex;align-items:center;gap:6px}
.qtyBtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
.qtyNum{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:20px;text-align:center}
.tickFoot{border-top:1px dashed var(--line);padding-top:8px}
.payBtn{flex:1;border:none;border-radius:12px;padding:13px 8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.clearBtn{width:100%;background:none;border:none;color:var(--faint);font-size:12.5px;font-weight:600;margin-top:8px;cursor:pointer}
.done{display:flex;align-items:center;justify-content:center;color:var(--sage);font-weight:700;font-size:13.5px;margin-top:8px;gap:6px}
.recipeRow{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
.toggleRow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-bottom:4px;gap:10px}

.toggle.on .knob{transform:translateX(18px)}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* ============================================================
   STEP 1 — PASTE YOUR SUPABASE VALUES HERE
   (Supabase Dashboard → Project Settings → API)
============================================================ */
const SUPABASE_URL = "https://ivituapwkzusopdtoqnq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2aXR1YXB3a3p1c29wZHRvcW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTQ4OTEsImV4cCI6MjEwMDgzMDg5MX0.lVGtRM1pei_cFxy4l1Buqq6RcmrrE7w-PB8ZCXw371g";
/* ============================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const { useState, useEffect, useCallback, useRef } = React;

const todayStr = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => (Math.round((Number(n||0)+Number.EPSILON)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const N = (v) => Number(v || 0);

function compressImage(file, maxDim=340){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image();
      img.onload=()=>{ const s=Math.min(1,maxDim/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL("image/jpeg",0.72)); };
      img.onerror=reject; img.src=reader.result; };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

/* ---------- data access ---------- */
async function fetchAll(){
  const [st, me, co, mi, ex, or_, iv, po] = await Promise.all([
    sb.from("settings").select("*").eq("id",1).single(),
    sb.from("members").select("*").order("created_at"),
    sb.from("components").select("*").order("created_at"),
    sb.from("menu_items").select("*").order("created_at"),
    sb.from("expenses").select("*").order("created_at",{ascending:false}),
    sb.from("orders").select("*").order("order_time",{ascending:false}),
    sb.from("inventory").select("*"),
    sb.from("preorders").select("*").order("created_at",{ascending:false}),
  ]);
  const firstErr = [st,me,co,mi,ex,or_,iv,po].find(r=>r.error);
  if(firstErr) throw new Error(firstErr.error.message);
  const inv={}; (iv.data||[]).forEach(r=>{ inv[r.component_id]=N(r.count); });
  return {
    settings: st.data,
    members: me.data||[],
    components: (co.data||[]).map(c=>({id:c.id,name:c.name,type:c.type,tracked:c.tracked,perTogo:c.per_togo})),
    menuItems: (mi.data||[]).map(m=>({id:m.id,name:m.name,category:m.category,price:N(m.price),photo:m.photo,includesDrink:m.includes_drink,recipe:m.recipe||[],planServings:N(m.plan_servings),containerId:m.container_id||null})),
    expenses: (ex.data||[]).map(e=>({id:e.id,memberId:e.member_id,desc:e.descr,amount:N(e.amount),componentId:e.component_id,date:e.exp_date,flagged:e.flagged,byAdmin:e.by_admin})),
    orders: (or_.data||[]).map(o=>({id:o.id,time:o.order_time,type:o.order_type,payment:o.payment,total:N(o.total),items:o.items||[],usage:o.usage||{},flagged:o.flagged})),
    preorders: (po.data||[]).map(p=>({id:p.id,name:p.customer_name,items:p.items||[],usage:p.usage||{},total:N(p.total),paid:p.paid,payment:p.payment,status:p.status,created:p.created_at})),
    inv,
  };
}
async function dbErr(p){ const {error,data}=await p; if(error) throw new Error(error.message); return data; }

/* ---------- shared math ---------- */
function buildTotals(data){
  const validExp = data.expenses.filter(e=>!e.flagged);
  const totalExpenses = validExp.reduce((a,e)=>a+e.amount,0);
  const expByComponent={}; let generalExp=0;
  validExp.forEach(e=>{ if(e.componentId) expByComponent[e.componentId]=(expByComponent[e.componentId]||0)+e.amount; else generalExp+=e.amount; });
  const expByMember={};
  validExp.forEach(e=>{ expByMember[e.memberId]=(expByMember[e.memberId]||0)+e.amount; });
  const validOrders=data.orders.filter(o=>!o.flagged);
  const paidPre=(data.preorders||[]).filter(p=>p.paid&&p.status!=="canceled");
  const unpaidPre=(data.preorders||[]).filter(p=>!p.paid&&p.status==="pending");
  const totalRevenue=validOrders.reduce((a,o)=>a+o.total,0)+paidPre.reduce((a,p)=>a+p.total,0);
  const cashRevenue=validOrders.filter(o=>o.payment==="cash").reduce((a,o)=>a+o.total,0)
    +paidPre.filter(p=>p.payment==="cash").reduce((a,p)=>a+p.total,0);
  const zelleRevenue=totalRevenue-cashRevenue;
  const soldByMenuItem={};
  validOrders.forEach(o=>(o.items||[]).forEach(li=>{
    if(!soldByMenuItem[li.menuItemId]) soldByMenuItem[li.menuItemId]={qty:0,revenue:0};
    soldByMenuItem[li.menuItemId].qty+=li.qty; soldByMenuItem[li.menuItemId].revenue+=li.qty*N(li.price);
  }));
  paidPre.forEach(p=>(p.items||[]).forEach(li=>{
    if(!soldByMenuItem[li.menuItemId]) soldByMenuItem[li.menuItemId]={qty:0,revenue:0};
    soldByMenuItem[li.menuItemId].qty+=li.qty; soldByMenuItem[li.menuItemId].revenue+=li.qty*N(li.price);
  }));
  return {validExp,totalExpenses,expByComponent,generalExp,expByMember,validOrders,totalRevenue,cashRevenue,zelleRevenue,soldByMenuItem,netIncome:totalRevenue-totalExpenses,
    paidPre,unpaidPre,unpaidPreTotal:unpaidPre.reduce((a,p)=>a+p.total,0)};
}

/* ================================================================ */
function App(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState("");
  const [session,setSession]=useState({role:null,memberId:null});
  const configured = !SUPABASE_URL.startsWith("PASTE");

  const loadAll=useCallback(async()=>{
    if(!configured){ setErr("Supabase URL/key not set — edit the two lines at the top of index.html."); setData({empty:true}); return; }
    try{ setData(await fetchAll()); setErr(""); }
    catch(e){ setErr(`Couldn't load: ${e.message}`); if(!data) setData({empty:true}); }
  },[]);
  useEffect(()=>{ loadAll(); },[loadAll]);
  useEffect(()=>{
    if(!session.role) return;
    const t=setInterval(loadAll, 15000);
    return ()=>clearInterval(t);
  },[session.role,loadAll]);

  const run = async (fn, failMsg) => {
    try{ await fn(); await loadAll(); setErr(""); return true; }
    catch(e){ setErr(`${failMsg} (${e.message})`); return false; }
  };

  if(data===null) return <div className="app"><div className="loading"><span className="spin">⟳</span> Loading…</div></div>;

  const totals = data.empty? null : buildTotals(data);
  const common={data,totals,err,loadAll,run,session,setSession};

  if(data.empty || !totals) return <Shell><Header title="Syracuse Family" sub="setup needed"/><ErrBanner err={err} onRetry={loadAll}/></Shell>;
  if(session.role==="admin") return <AdminScreen {...common}/>;
  if(session.role==="cashier") return <CashierScreen {...common}/>;
  if(session.role==="member") return <MemberScreen {...common}/>;
  return <RolePicker {...common}/>;
}

function Shell({children,wide}){ return <div className={"app"+(wide?" wide":"")}>{children}</div>; }
function Header({title,sub,right,icon="👨‍🍳"}){
  return <div className="header"><div className="headerInner">
    <span className="icon">{icon}</span>
    <div style={{flex:1}}><div className="hTitle">{title}</div><div className="hSub">{sub}</div></div>
    {right}
  </div></div>;
}
function ErrBanner({err,onRetry}){
  if(!err) return null;
  return <div className="errBanner"><span>{err}</span>{onRetry&&<button className="errRetry" onClick={onRetry}>Retry</button>}</div>;
}
function Modal({title,color,onClose,children}){
  return <div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="mHead"><span className="mTitle" style={{color}}>{title}</span>
    <button className="iconBtn" onClick={onClose}>✕</button></div>{children}</div></div>;
}
function Toggle({label,value,onChange}){
  return <div className="toggleRow"><span style={{fontSize:13.5,color:"#5B5546"}}>{label}</span>
    <button type="button" className={"toggle"+(value?" on":"")} onClick={()=>onChange(!value)}><span className="knob"/></button></div>;
}
function NavBtn({active,onClick,icon,label}){
  return <button className={"navBtn"+(active?" active":"")} onClick={onClick}>
    <span style={{fontSize:18}}>{icon}</span><span className="navLabel">{label}</span>{active&&<span className="navDot"/>}</button>;
}
function BackRow({onClick,label}){
  return <div className="backRow"><button className="backBtn" onClick={onClick}>←</button><span className="backLabel">{label}</span></div>;
}

/* ---------------- ROLE PICKER ---------------- */
function RolePicker(props){
  const {data,err,loadAll,run,setSession}=props;
  const [mode,setMode]=useState(null);
  const firstSetup=!data.settings?.admin_pin;
  return <Shell>
    <Header title="Syracuse Family" sub="cooked food sale · choose your role"/>
    <ErrBanner err={err} onRetry={loadAll}/>
    <div className="main">
      {!mode&&<div>
        <button className="roleCard" onClick={()=>setMode("member")}>
          <span className="roleIcon">🧑‍🤝‍🧑</span><span style={{flex:1}}><div className="roleTitle">Member</div><div className="roleSub">Log your dish expenses · see live sales</div></span><span>›</span></button>
        <button className="roleCard" onClick={()=>setMode("cashier")}>
          <span className="roleIcon">🛒</span><span style={{flex:1}}><div className="roleTitle">Cashier</div><div className="roleSub">Take orders on the iPad</div></span><span>›</span></button>
        <button className="roleCard" onClick={()=>setMode(firstSetup?"setup":"admin")}>
          <span className="roleIcon">🛡️</span><span style={{flex:1}}><div className="roleTitle">Admin</div><div className="roleSub">Set up everything · reports</div></span><span>›</span></button>
      </div>}
      {mode==="member"&&<MemberLogin data={data} setSession={setSession} onBack={()=>setMode(null)}/>}
      {mode==="cashier"&&<PinLogin title="Cashier unlock" back={()=>setMode(null)}
        hint={!data.settings?.cashier_pin?"No cashier PIN set yet — admin sets it in Settings.":null}
        check={p=>data.settings?.cashier_pin&&p===data.settings.cashier_pin}
        onOk={()=>setSession({role:"cashier",memberId:null})}/>}
      {mode==="admin"&&<PinLogin title="Admin unlock" back={()=>setMode(null)}
        check={p=>p===data.settings.admin_pin}
        onOk={()=>setSession({role:"admin",memberId:null})}/>}
      {mode==="setup"&&<FirstSetup back={()=>setMode(null)} run={run} onDone={()=>setSession({role:"admin",memberId:null})}/>}
    </div>
  </Shell>;
}
function MemberLogin({data,setSession,onBack}){
  const [memberId,setMemberId]=useState(""); const [pin,setPin]=useState(""); const [error,setError]=useState("");
  const submit=e=>{ e.preventDefault();
    const m=data.members.find(x=>x.id===memberId);
    if(!m){setError("Pick your name.");return;}
    if(pin!==m.pin){setError("Incorrect PIN.");return;}
    setSession({role:"member",memberId:m.id});
  };
  return <div><BackRow onClick={onBack} label="Member sign-in"/>
    {data.members.length===0? <div className="empty">No members yet. Ask the admin to add you.</div> :
    <form onSubmit={submit}>
      <div className="field"><label className="fLabel">Your name</label>
        <div className="chips">{data.members.map(m=>
          <button key={m.id} type="button" className={"chip"+(memberId===m.id?" active":"")} onClick={()=>setMemberId(m.id)}>{m.name}</button>)}</div></div>
      <div className="field"><label className="fLabel">Your PIN</label>
        <input className="input" type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)} placeholder="••••"/></div>
      {error&&<div className="fieldErr">{error}</div>}
      <button className="submit" style={{background:"var(--gold)"}}>Sign in</button>
    </form>}
  </div>;
}
function PinLogin({title,check,onOk,back,hint}){
  const [pin,setPin]=useState(""); const [error,setError]=useState("");
  return <div><BackRow onClick={back} label={title}/>
    {hint&&<div className="note">{hint}</div>}
    <form onSubmit={e=>{e.preventDefault(); check(pin)?onOk():setError("Incorrect PIN.");}}>
      <div className="field"><label className="fLabel">PIN</label>
        <input className="input" type="password" value={pin} onChange={e=>setPin(e.target.value)} autoFocus placeholder="••••"/></div>
      {error&&<div className="fieldErr">{error}</div>}
      <button className="submit" style={{background:"var(--ink)"}}>Unlock</button>
    </form></div>;
}
function FirstSetup({onDone,back,run}){
  const [pin,setPin]=useState(""); const [confirm,setConfirm]=useState(""); const [cashierPin,setCashierPin]=useState(""); const [error,setError]=useState("");
  const submit=async e=>{ e.preventDefault();
    if(pin.length<4){setError("Admin PIN: at least 4 characters.");return;}
    if(pin!==confirm){setError("PINs don't match.");return;}
    const ok=await run(()=>dbErr(sb.from("settings").update({admin_pin:pin,cashier_pin:cashierPin.trim()}).eq("id",1)),"Couldn't save");
    if(ok) onDone();
  };
  return <div><BackRow onClick={back} label="First-time admin setup"/>
    <p style={{fontSize:13,color:"#5B5546",lineHeight:1.5}}>Set your admin PIN (only you). Optionally set the cashier PIN now.</p>
    <form onSubmit={submit}>
      <div className="field"><label className="fLabel">Admin PIN</label><input className="input" type="password" value={pin} onChange={e=>setPin(e.target.value)} autoFocus/></div>
      <div className="field"><label className="fLabel">Confirm admin PIN</label><input className="input" type="password" value={confirm} onChange={e=>setConfirm(e.target.value)}/></div>
      <div className="field"><label className="fLabel">Cashier PIN (optional)</label><input className="input" value={cashierPin} onChange={e=>setCashierPin(e.target.value)}/></div>
      {error&&<div className="fieldErr">{error}</div>}
      <button className="submit" style={{background:"var(--ink)"}}>Save & continue</button>
    </form></div>;
}

function MemberScreen(props){
  const {data,totals,err,loadAll,run,session,setSession}=props;
  const me=data.members.find(m=>m.id===session.memberId);
  const [tab,setTab]=useState("mine");
  const [showForm,setShowForm]=useState(false);
  const mine=data.expenses.filter(e=>e.memberId===session.memberId);
  const dishes=data.components.filter(c=>c.type!=="supply");

  const addExpense=async entry=>{
    const cid=entry.componentId==="general"?null:entry.componentId;
    const rows=[{member_id:session.memberId,descr:entry.desc,amount:entry.amount,component_id:cid,exp_date:entry.date}];
    if(entry.tax>0) rows.push({member_id:session.memberId,descr:`Tax — ${entry.desc}`,amount:entry.tax,component_id:cid,exp_date:entry.date});
    const ok=await run(()=>dbErr(sb.from("expenses").insert(rows)),"Couldn't save expense");
    if(ok) setShowForm(false);
  };
  const toggleFlag=e=>run(()=>dbErr(sb.from("expenses").update({flagged:!e.flagged}).eq("id",e.id)),"Couldn't update");

  return <Shell>
    <Header title={`Hi, ${me?.name}`} sub="member view" right={<button className="smallBtn" onClick={()=>setSession({role:null,memberId:null})}>Sign out</button>}/>
    <ErrBanner err={err} onRetry={loadAll}/>
    <div className="main">
      {tab==="mine"&&<div>
        <div className="listHead"><span className="listTitle">🧾 My expenses</span>
          <button className="btn rust" onClick={()=>setShowForm(true)}>＋ Add expense</button></div>
        {mine.length===0&&<div className="empty">Nothing yet. Tap "Add expense" — what you bought, how much, which dish.</div>}
        {mine.map(e=><ExpenseItem key={e.id} e={e} data={data}
          action={<button className="iconBtn" title={e.flagged?"Unmark error":"Mark as error"} onClick={()=>toggleFlag(e)}>{e.flagged?"↩️":"🚩"}</button>}/>)}
        <div className="receipt" style={{marginTop:16}}>
          <div className="rRow"><span className="rLabel">My total (to be reimbursed)</span>
          <span className="rNum" style={{color:"var(--rust)"}}>${fmt(mine.filter(x=>!x.flagged).reduce((a,x)=>a+x.amount,0))}</span></div>
        </div>
      </div>}
      {tab==="overall"&&<OverallView data={data} totals={totals}/>}
      {tab==="live"&&<LiveView data={data} totals={totals} onRefresh={loadAll}/>}
    </div>
    <div className="navBar">
      <NavBtn active={tab==="mine"} onClick={()=>setTab("mine")} icon="🧾" label="My expenses"/>
      <NavBtn active={tab==="overall"} onClick={()=>setTab("overall")} icon="📊" label="Overall"/>
      <NavBtn active={tab==="live"} onClick={()=>setTab("live")} icon="🛒" label="Live sales"/>
    </div>
    {showForm&&<ExpenseModal dishes={dishes} onClose={()=>setShowForm(false)} onSubmit={addExpense}/>}
  </Shell>;
}

        <button type="button" className={"chip"+(componentId==="general"?" active":"")} onClick={()=>setComponentId("general")}>General / other</button></div></div>

/* ---------------- CASHIER ---------------- */
function CashierScreen(props){
  const {data,err,loadAll,run,setSession}=props;
  const [ticket,setTicket]=useState([]);
  const [drinkPickFor,setDrinkPickFor]=useState(null);
  const [showZelle,setShowZelle]=useState(false);
  const [zelleConfirmed,setZelleConfirmed]=useState(false);
  const [doneFlash,setDoneFlash]=useState(false);
  const [view,setView]=useState("register"); // 'register' | 'preorders'
  const [showPreForm,setShowPreForm]=useState(false);
  const [payPre,setPayPre]=useState(null); // preorder being paid via zelle

  const drinks=data.components.filter(c=>c.type==="drink");
  const remaining=cid=>N(data.inv[cid]);

  const usage=()=>{ const u={}; const add=(id,n)=>{u[id]=(u[id]||0)+n;};
    ticket.forEach(li=>{ const mi=data.menuItems.find(m=>m.id===li.menuItemId);
      (mi?.recipe||[]).forEach(r=>add(r.componentId,r.qty*li.qty));
      if(li.drinkId) add(li.drinkId,li.qty);
      if(mi?.containerId) add(mi.containerId,li.qty); });
    return u; };

  const availableQty=mi=>{ const u=usage(); let max=Infinity;
    (mi.recipe||[]).forEach(r=>{ const c=data.components.find(x=>x.id===r.componentId);
      if(!c||(c.type==="supply"&&!c.tracked)) return;
      max=Math.min(max,Math.floor((remaining(r.componentId)-(u[r.componentId]||0))/r.qty)); });
    return max===Infinity?999:Math.max(0,max); };

  const tapItem=mi=>{ if(availableQty(mi)<=0) return; mi.includesDrink?setDrinkPickFor(mi):addLine(mi,null); };
  const addLine=(mi,drinkId)=>{ setTicket(t=>{ const ex=t.find(l=>l.menuItemId===mi.id&&l.drinkId===drinkId);
    if(ex) return t.map(l=>l===ex?{...l,qty:l.qty+1}:l);
    return [...t,{lineId:Math.random().toString(36).slice(2),menuItemId:mi.id,qty:1,drinkId}]; }); setDrinkPickFor(null); };
  const changeQty=(id,d)=>setTicket(t=>t.map(l=>l.lineId===id?{...l,qty:l.qty+d}:l).filter(l=>l.qty>0));
  const total=ticket.reduce((a,l)=>{const mi=data.menuItems.find(m=>m.id===l.menuItemId);return a+N(mi?.price)*l.qty;},0);

  const complete=async pay=>{
    if(ticket.length===0) return;
    const u=usage();
    const ok=await run(async()=>{
      await dbErr(sb.from("orders").insert({order_type:"togo",payment:pay,total,
        items:ticket.map(l=>{const mi=data.menuItems.find(m=>m.id===l.menuItemId);
          return {menuItemId:l.menuItemId,name:mi?.name,qty:l.qty,price:N(mi?.price),drinkId:l.drinkId||null};}),
        usage:u}));
      const rows=Object.entries(u).map(([cid,n])=>({component_id:cid,count:N(data.inv[cid])-n}));
      if(rows.length) await dbErr(sb.from("inventory").upsert(rows));
    },"Couldn't save order");
    if(ok){ setTicket([]); setShowZelle(false); setDoneFlash(true); setTimeout(()=>setDoneFlash(false),1500); }
  };

  const createPreorder=async ({name,payMethod})=>{
    if(ticket.length===0) return false;
    const u=usage();
    const ok=await run(async()=>{
      await dbErr(sb.from("preorders").insert({customer_name:name,total,
        items:ticket.map(l=>{const mi=data.menuItems.find(m=>m.id===l.menuItemId);
          return {menuItemId:l.menuItemId,name:mi?.name,qty:l.qty,price:N(mi?.price),drinkId:l.drinkId||null};}),
        usage:u, paid:!!payMethod, payment:payMethod||null}));
      const rows=Object.entries(u).map(([cid,n])=>({component_id:cid,count:N(data.inv[cid])-n}));
      if(rows.length) await dbErr(sb.from("inventory").upsert(rows));
    },"Couldn't save pre-order");
    if(ok){ setTicket([]); setShowPreForm(false); setDoneFlash(true); setTimeout(()=>setDoneFlash(false),1500); }
    return ok;
  };
  const markPrePaid=(p,method)=>run(()=>dbErr(sb.from("preorders").update({paid:true,payment:method}).eq("id",p.id)),"Couldn't update pre-order");
  const releasePre=p=>run(()=>dbErr(sb.from("preorders").update({status:"released"}).eq("id",p.id)),"Couldn't release");
  const cancelPre=p=>run(async()=>{
    const rows=Object.entries(p.usage||{}).map(([cid,n])=>({component_id:cid,count:N(data.inv[cid])+n}));
    await dbErr(sb.from("preorders").update({status:"canceled"}).eq("id",p.id));
    if(rows.length) await dbErr(sb.from("inventory").upsert(rows));
  },"Couldn't cancel");

  const cats=[["meal","Meals"],["alacarte","À la carte"],["drink","Drinks"]];
  return <Shell wide>
    <Header icon="🛒" title="Cashier" sub="tap items · take payment" right={<span style={{display:"flex",gap:8}}>
      <button className="smallBtn" onClick={loadAll}>🔄 Sync</button>
      <button className="smallBtn" onClick={()=>setSession({role:null,memberId:null})}>Exit</button></span>}/>
    <ErrBanner err={err} onRetry={loadAll}/>
    <div style={{display:"flex",gap:8,padding:"12px 16px 0"}}>
      <button className={"chip"+(view==="register"?" active":"")} onClick={()=>setView("register")}>🛒 Register</button>
      <button className={"chip"+(view==="preorders"?" active":"")} onClick={()=>setView("preorders")}>
        📋 Pre-orders{data.preorders.filter(p=>p.status==="pending").length>0?` (${data.preorders.filter(p=>p.status==="pending").length})`:""}
      </button>
    </div>
    {view==="preorders"&&<PreordersView data={data} markPrePaid={markPrePaid} releasePre={releasePre} cancelPre={cancelPre} setPayPre={setPayPre}/>}
    {view==="register"&&<div className="cashier">
      <div className="cMenu">
        {cats.map(([key,label])=>{ const list=data.menuItems.filter(m=>m.category===key);
          if(!list.length) return null;
          return <div key={key}><div className="secLabel">{label}</div>
            <div className="tiles">{list.map(mi=>{ const avail=availableQty(mi); const out=avail<=0;
              return <button key={mi.id} className={"tile"+(out?" soldout":"")} onClick={()=>tapItem(mi)}>
                {mi.photo?<img className="tileImg" src={mi.photo} alt=""/>:<div className="tilePh">🍽️</div>}
                <div className="tileName">{mi.name}</div>
                <div className="tileMeta"><span className="tilePrice">${fmt(mi.price)}</span>
                  <span className={"tileStock"+(out?" out":"")}>{out?"SOLD OUT":avail<=999?`${avail} left`:""}</span></div>
              </button>;})}</div></div>;})}
        {data.menuItems.length===0&&<div className="empty">No menu yet — admin sets it up.</div>}
      </div>
      <div className="ticket">
        <div className="tickHead"><span style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:16}}>Order</span>
          <span className="iSub">all to-go</span></div>
        <div className="tickLines">
          {ticket.length===0&&<div className="empty">Tap items to add them.</div>}
          {ticket.map(l=>{ const mi=data.menuItems.find(m=>m.id===l.menuItemId);
            const drink=l.drinkId?data.components.find(c=>c.id===l.drinkId):null;
            return <div key={l.lineId} className="tickLine">
              <div style={{flex:1,minWidth:0}}><div className="iTitle">{mi?.name}</div>{drink&&<div className="iSub">{drink.name}</div>}</div>
              <div className="qty"><button className="qtyBtn" onClick={()=>changeQty(l.lineId,-1)}>−</button>
                <span className="qtyNum">{l.qty}</span>
                <button className="qtyBtn" onClick={()=>changeQty(l.lineId,1)}>＋</button></div>
              <span className="iAmt">${fmt(N(mi?.price)*l.qty)}</span>
            </div>;})}
        </div>
        <div className="tickFoot">
          <div className="rRow"><span className="rLabel big">Total</span><span className="rNum" style={{fontSize:24}}>${fmt(total)}</span></div>
          {ticket.length>0&&<div style={{display:"flex",gap:8,marginTop:8}}>
            <button className="payBtn" style={{background:"var(--sage)"}} onClick={()=>complete("cash")}>Cash received</button>
            <button className="payBtn" style={{background:"var(--purple)"}} onClick={()=>setShowZelle(true)}>Zelle QR</button>
          </div>}
          {ticket.length>0&&<button className="payBtn" style={{background:"var(--gold)",width:"100%",marginTop:8}}
            onClick={()=>setShowPreForm(true)}>📋 Save as pre-order</button>}
          {ticket.length>0&&<button className="clearBtn" onClick={()=>setTicket([])}>Clear order</button>}
          {doneFlash&&<div className="done">✔️ Order saved!</div>}
        </div>
      </div>
    </div>}
    {drinkPickFor&&<Modal title={`Drink for ${drinkPickFor.name}`} color="var(--sage)" onClose={()=>setDrinkPickFor(null)}>
      <div className="chips">{drinks.map(d=>{ const out=remaining(d.id)-(usage()[d.id]||0)<=0;
        return <button key={d.id} className="chip" style={{fontSize:16,padding:"14px 20px",opacity:out?.4:1}} disabled={out}
          onClick={()=>addLine(drinkPickFor,d.id)}>{d.name}{out?" (out)":""}</button>;})}</div>
    </Modal>}
    {showZelle&&<Modal title="Zelle payment" color="var(--purple)" onClose={()=>{setShowZelle(false);setZelleConfirmed(false);}}>
      <div style={{textAlign:"center",margin:"4px 0 12px"}}>
        <div style={{fontSize:13,color:"#5B5546"}}>Please send exactly</div>
        <div className="mono" style={{fontSize:34,fontWeight:700}}>${fmt(total)}</div>
      </div>
      {data.settings.zelle_qr?<img className="qrImg" src={data.settings.zelle_qr} alt="Zelle QR"/>:
        <div className="empty">No Zelle QR uploaded — admin adds it in Settings.</div>}
      <label style={{display:"flex",alignItems:"center",gap:10,marginTop:14,fontSize:14,fontWeight:600,cursor:"pointer"}}>
        <input type="checkbox" style={{width:20,height:20}} checked={zelleConfirmed} onChange={e=>setZelleConfirmed(e.target.checked)}/>
        I saw the Zelle notification arrive for ${fmt(total)}
      </label>
      <button className="submit" style={{background:"var(--sage)",marginTop:12,opacity:zelleConfirmed?1:.5}} disabled={!zelleConfirmed}
        onClick={()=>{setZelleConfirmed(false);complete("zelle");}}>Payment received — done</button>
    </Modal>}
    {showPreForm&&<PreorderFormModal total={total} onClose={()=>setShowPreForm(false)} onSave={createPreorder} zelleQr={data.settings.zelle_qr}/>}
    {payPre&&<Modal title={`Zelle — ${payPre.name}`} color="var(--purple)" onClose={()=>setPayPre(null)}>
      <div style={{textAlign:"center",margin:"4px 0 12px"}}>
        <div style={{fontSize:13,color:"#5B5546"}}>Please send exactly</div>
        <div className="mono" style={{fontSize:34,fontWeight:700}}>${fmt(payPre.total)}</div>
      </div>
      {data.settings.zelle_qr?<img className="qrImg" src={data.settings.zelle_qr} alt="Zelle QR"/>:
        <div className="empty">No Zelle QR uploaded — admin adds it in Settings.</div>}

}

    <span style={{fontSize:11,fontWeight:700,color:"var(--rust)",background:"#FBEAE3",padding:"3px 8px",borderRadius:10}}>NOT PAID</span>;

        <Items p={p}/>

        {!p.paid&&<>
          <button className="smallBtn" onClick={()=>markPrePaid(p,"cash")}>💵 Paid cash</button>
          <button className="smallBtn" onClick={()=>setPayPre(p)}>Zelle QR</button>
          <button className="smallBtn" style={{color:"var(--rust)"}} onClick={()=>{if(confirm(`Cancel ${p.name}'s pre-order? The food goes back on sale.`)) cancelPre(p);}}>Cancel</button>
        </>}

function AdminDash(props){
  const {data,totals,run}=props;
  const deleteOrder=o=>run(async()=>{
    const rows=Object.entries(o.usage||{}).map(([cid,n])=>({component_id:cid,count:N(data.inv[cid])+n}));
    await dbErr(sb.from("orders").delete().eq("id",o.id));
    if(rows.length) await dbErr(sb.from("inventory").upsert(rows));
  },"Couldn't delete order");

  const exportExcel=()=>{
    const wb=XLSX.utils.book_new();
    const rows=[["Fundraiser — Settlement"],[],
      ["Total revenue",totals.totalRevenue],["  Cash",totals.cashRevenue],["  Zelle",totals.zelleRevenue],
      ["Total expenses",totals.totalExpenses],["Net income",totals.netIncome],[],
      ["Reimbursement owed per member"],["Member","Amount"]];
    data.members.forEach(m=>rows.push([m.name,totals.expByMember[m.id]||0]));
    rows.push([],["Sales by item"],["Item","Qty sold","Revenue"]);
    data.menuItems.forEach(mi=>{const s=totals.soldByMenuItem[mi.id];rows.push([mi.name,s?.qty||0,s?.revenue||0]);});
    rows.push([],["Inventory — remaining"],["Component","Remaining"]);
    data.components.filter(c=>c.tracked!==false).forEach(c=>rows.push([c.name,N(data.inv[c.id])]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Summary");
    const eRows=[["Member","Description","Dish","Amount","Date","Status"]];
    data.expenses.forEach(e=>{const m=data.members.find(x=>x.id===e.memberId);
      const comp=e.componentId?data.components.find(c=>c.id===e.componentId)?.name||"":"General";
      eRows.push([m?.name||"",e.desc,comp,e.amount,e.date||"",e.flagged?"Error":"Valid"]);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(eRows),"Expenses");
    const oRows=[["Time","Type","Payment","Items","Total","Status"]];
    data.orders.forEach(o=>oRows.push([o.time,o.type,o.payment,(o.items||[]).map(i=>`${i.qty}x ${i.name}`).join(", "),o.total,o.flagged?"Error":"Valid"]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(oRows),"Sales");
    const pRows=[["Customer","Items","Total","Paid","Payment","Status"]];
    data.preorders.forEach(p=>pRows.push([p.name,(p.items||[]).map(i=>`${i.qty}x ${i.name}`).join(", "),p.total,p.paid?"Yes":"No",p.payment||"",p.status]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pRows),"Pre-orders");
    XLSX.writeFile(wb,`fundraiser-${todayStr()}.xlsx`);
  };

  return <div>
    <div className="receipt">
      <div className="rRow"><span className="rLabel">Revenue ({totals.validOrders.length} orders)</span><span className="rNum" style={{color:"var(--sage)"}}>${fmt(totals.totalRevenue)}</span></div>
      <div className="rRow"><span className="rLabel">Cash / Zelle</span><span className="rNum">${fmt(totals.cashRevenue)} / ${fmt(totals.zelleRevenue)}</span></div>
      {totals.unpaidPre.length>0&&<div className="rRow"><span className="rLabel">Unpaid pre-orders ({totals.unpaidPre.length})</span>
        <span className="rNum" style={{color:"var(--gold)"}}>${fmt(totals.unpaidPreTotal)}</span></div>}
      <div className="rRow"><span className="rLabel">Expenses</span><span className="rNum" style={{color:"var(--rust)"}}>-${fmt(totals.totalExpenses)}</span></div>
      <div className="rDiv"/>
      <div className="rRow"><span className="rLabel big">Net income</span>
        <span className="rNum" style={{fontSize:26,color:totals.netIncome>=0?"var(--sage)":"var(--rust)"}}>{totals.netIncome>=0?"$":"-$"}{fmt(Math.abs(totals.netIncome))}</span></div>
    </div>
    <button className="export" onClick={exportExcel}>📥 Export to Excel</button>
    <div className="secLabel">Pay back members</div>
    <div className="tableCard">{data.members.map(m=>
      <div key={m.id} className="tRow"><span>{m.name}</span><span className="mono" style={{color:"var(--rust)"}}>${fmt(totals.expByMember[m.id]||0)}</span></div>)}</div>
    <div className="secLabel">Recent orders</div>
    {data.orders.length===0&&<div className="empty">No orders yet.</div>}
    {data.orders.slice(0,25).map(o=><div key={o.id} className="item">
      <div className="iMain"><div className="iTitle">{(o.items||[]).map(i=>`${i.qty}× ${i.name}`).join(", ")}</div>
        <div className="iSub">{new Date(o.time).toLocaleTimeString()} · {o.type==="togo"?"To-go":"In-store"} · {o.payment}</div></div>
      <div className="iRight"><span className="iAmt" style={{color:"var(--sage)"}}>${fmt(o.total)}</span>
        <button className="iconBtn" title="Delete order (restores inventory)" onClick={()=>deleteOrder(o)}>🗑️</button></div>
    </div>)}
  </div>;
}

function AdminExpenses(props){
  const {data,run}=props;
  const [showForm,setShowForm]=useState(false);
  const [editExp,setEditExp]=useState(null);
  const dishes=data.components.filter(c=>c.type!=="supply");
  const addForMember=async entry=>{
    const cid=entry.componentId==="general"?null:entry.componentId;
    const rows=[{member_id:entry.memberId,descr:entry.desc,amount:entry.amount,component_id:cid,exp_date:entry.date,by_admin:true}];
    if(entry.tax>0) rows.push({member_id:entry.memberId,descr:`Tax — ${entry.desc}`,amount:entry.tax,component_id:cid,exp_date:entry.date,by_admin:true});
    const ok=await run(()=>dbErr(sb.from("expenses").insert(rows)),"Couldn't save expense");
    if(ok) setShowForm(false);
  };
  const updateExpense=async entry=>{
    const ok=await run(()=>dbErr(sb.from("expenses").update({member_id:entry.memberId,descr:entry.desc,amount:entry.amount,
      component_id:entry.componentId==="general"?null:entry.componentId,exp_date:entry.date}).eq("id",editExp.id)),"Couldn't update expense");
    if(ok) setEditExp(null);
  };
  const remove=e=>run(()=>dbErr(sb.from("expenses").delete().eq("id",e.id)),"Couldn't delete");
  return <div>
    <div className="listHead"><span className="listTitle">🧾 All expenses</span>
      <button className="btn rust" disabled={!data.members.length} onClick={()=>setShowForm(true)}>＋ Add for member</button></div>
    {!data.members.length&&<div className="note">Add members first (Settings tab).</div>}
    {data.expenses.length===0?<div className="empty">No expenses logged yet.</div>:
      data.expenses.map(e=>{const m=data.members.find(x=>x.id===e.memberId);
        return <ExpenseItem key={e.id} e={e} data={data} memberName={m?.name}
          action={<span style={{display:"flex",gap:6,alignItems:"center"}}>
            <button className="smallBtn" onClick={()=>setEditExp(e)}>Edit</button>
            <button className="iconBtn" title="Delete permanently" onClick={()=>remove(e)}>🗑️</button></span>}/>;})}
    {showForm&&<ExpenseModal dishes={dishes} members={data.members} onClose={()=>setShowForm(false)} onSubmit={addForMember}/>}
    {editExp&&<ExpenseModal dishes={dishes} members={data.members} initial={editExp} onClose={()=>setEditExp(null)} onSubmit={updateExpense}/>}
  </div>;
}

function AdminMenu(props){
  const {data,run}=props;
  const [editItem,setEditItem]=useState(null);
  const [editComp,setEditComp]=useState(null);
  const typeLabel={dish:"Dish",drink:"Drink",supply:"Supply"};

  const saveComponent=c=>run(async()=>{
    const row={name:c.name,type:c.type,tracked:c.tracked,per_togo:c.perTogo};
    if(c.id) await dbErr(sb.from("components").update(row).eq("id",c.id));
    else await dbErr(sb.from("components").insert(row));
  },"Couldn't save").then(ok=>ok&&setEditComp(null));
  const deleteComponent=id=>run(()=>dbErr(sb.from("components").delete().eq("id",id)),"Couldn't delete");
  const saveMenuItem=m=>run(async()=>{
    const row={name:m.name,category:m.category,price:m.price,photo:m.photo,includes_drink:m.includesDrink,recipe:m.recipe,container_id:m.containerId};
    if(m.id) await dbErr(sb.from("menu_items").update(row).eq("id",m.id));
    else await dbErr(sb.from("menu_items").insert(row));
  },"Couldn't save").then(ok=>ok&&setEditItem(null));
  const deleteMenuItem=id=>run(()=>dbErr(sb.from("menu_items").delete().eq("id",id)),"Couldn't delete");

  return <div>
    <div className="listHead"><span className="listTitle">👨‍🍳 Dishes, drinks & supplies</span>
      <button className="btn gold" onClick={()=>setEditComp({})}>＋ Add</button></div>
    <div className="note">Dishes are what members cook (expenses tag to these). Supplies can be untracked (tissue, skewers) or tracked (to-go containers).</div>
    {data.components.map(c=><div key={c.id} className="item">
      <div className="iMain"><div className="iTitle">{c.name}</div>
        <div className="iSub">{typeLabel[c.type]}{c.type==="supply"?(c.tracked?" · tracked":" · not tracked"):""}</div></div>
      <div className="iRight"><button className="smallBtn" onClick={()=>setEditComp(c)}>Edit</button>
        <button className="iconBtn" onClick={()=>deleteComponent(c.id)}>🗑️</button></div></div>)}

    <div className="listHead" style={{marginTop:26}}><span className="listTitle">🍽️ Menu (what customers buy)</span>
      <button className="btn sage" onClick={()=>setEditItem({})}>＋ Add</button></div>
    {data.menuItems.map(mi=><div key={mi.id} className="item">
      {mi.photo?<img className="thumb" src={mi.photo} alt=""/>:<div className="thumb">🍽️</div>}
      <div className="iMain"><div className="iTitle">{mi.name}</div>
        <div className="iSub">{mi.category} · ${fmt(mi.price)}{mi.includesDrink?" · drink included":""}</div></div>
      <div className="iRight"><button className="smallBtn" onClick={()=>setEditItem(mi)}>Edit</button>
        <button className="iconBtn" onClick={()=>deleteMenuItem(mi.id)}>🗑️</button></div></div>)}

    {editComp&&<ComponentModal comp={editComp.id?editComp:null} onClose={()=>setEditComp(null)} onSave={saveComponent}/>}
    {editItem&&<MenuItemModal item={editItem.id?editItem:null} data={data} onClose={()=>setEditItem(null)} onSave={saveMenuItem}/>}
  </div>;
}

  const [name,setName]=useState(comp?.name||"");
  const [type,setType]=useState(comp?.type||"dish");
  const [tracked,setTracked]=useState(comp?comp.tracked!==false:true);
  const [perTogo,setPerTogo]=useState(comp?.perTogo||false);
  const valid=name.trim();
  return <Modal title={comp?"Edit item":"Add dish / drink / supply"} color="var(--gold)" onClose={onClose}>
    <div className="field"><label className="fLabel">Name</label>

    <div className="field"><label className="fLabel">Type</label>
      <div className="chips">{[["dish","Dish (cooked)"],["drink","Drink"],["supply","Supply"]].map(([v,l])=>
        <button key={v} type="button" className={"chip"+(type===v?" active":"")} onClick={()=>setType(v)}>{l}</button>)}</div></div>
    {type==="supply"&&<Toggle label="Track inventory (count it)?" value={tracked} onChange={setTracked}/>}

        <button key={v} type="button" className={"chip"+(category===v?" active":"")} onClick={()=>setCategory(v)}>{l}</button>)}</div></div>

    <div className="field"><label className="fLabel">Photo (for cashier tile)</label>

        {photo&&<img className="thumb" src={photo} alt=""/>}
        <button type="button" className="smallBtn" onClick={()=>fileRef.current?.click()}>📷 {photo?"Change":"Upload"}</button>

      :
      <div className="field"><label className="fLabel">Recipe — servings of each dish per order</label>
        {comps.length===0&&<div className="empty">Add dishes first.</div>}
        {comps.map(c=><div key={c.id} className="recipeRow">
          <span style={{flex:1,fontSize:14}}>{c.name}</span>
          <div className="qty"><button type="button" className="qtyBtn" onClick={()=>setQty(c.id,Math.max(0,qtyOf(c.id)-1))}>−</button>
            <span className="qtyNum">{qtyOf(c.id)}</span>
            <button type="button" className="qtyBtn" onClick={()=>setQty(c.id,qtyOf(c.id)+1)}>＋</button></div>
        </div>)}</div>}
    <div className="field"><label className="fLabel">Container used per order (all orders are to-go)</label>
      <div className="chips">
        <button type="button" className={"chip"+(!containerId?" active":"")} onClick={()=>setContainerId(null)}>None</button>
        {supplies.map(s=><button key={s.id} type="button" className={"chip"+(containerId===s.id?" active":"")}

      </div></div>
    <button className="submit" style={{background:"var(--sage)",opacity:valid?1:.5}} disabled={!valid}
      onClick={()=>onSave({id:item?.id,name:name.trim(),category,price:N(price),photo,includesDrink:category!=="drink"&&includesDrink,recipe,containerId})}>Save menu item</button>
  </Modal>;
}

function AdminInventory(props){
  const {data,run}=props;
  const tracked=data.components.filter(c=>c.tracked!==false);
  const [draft,setDraft]=useState(null);
  const start=()=>{const d={};tracked.forEach(c=>{d[c.id]=N(data.inv[c.id]);});setDraft(d);};
  const commit=async()=>{
    const rows=Object.entries(draft).map(([cid,v])=>({component_id:cid,count:N(v)}));
    const ok=await run(()=>dbErr(sb.from("inventory").upsert(rows)),"Couldn't save counts");
    if(ok) setDraft(null);
  };
  return <div>
    <div className="listHead"><span className="listTitle">📦 Inventory counts</span>
      {draft?<button className="btn sage" onClick={commit}>Save counts</button>:
        <button className="btn gold" onClick={start}>Edit counts</button>}</div>
    <div className="note">Enter what's actually prepared/bought: servings per dish, number of drinks, number of to-go containers. Sales count these down automatically.</div>
    {tracked.length===0&&<div className="empty">Add dishes/drinks/supplies in the Menu tab first.</div>}
    {tracked.map(c=><div key={c.id} className="item">
      <div className="iMain"><div className="iTitle">{c.name}</div>
        <div className="iSub">{c.type==="dish"?"servings":c.type==="drink"?"bottles/cans":"pieces"}</div></div>
      {draft?
        <input className="input mono" style={{width:90,textAlign:"right"}} type="number" inputMode="numeric"
          value={draft[c.id]} onChange={e=>setDraft({...draft,[c.id]:e.target.value})}/>
        :<span className="iAmt" style={{color:N(data.inv[c.id])<=0?"var(--rust)":"var(--ink)"}}>{N(data.inv[c.id])}</span>}
    </div>)}
  </div>;
}

function AdminPricing(props){
  const {data,totals,run}=props;
  const [target,setTarget]=useState(N(data.settings.target_profit));
  const [plan,setPlan]=useState(()=>{const p={};data.menuItems.forEach(mi=>{p[mi.id]={price:mi.price,servings:mi.planServings};});return p;});
  const sellable=data.menuItems;
  const dishOutput={};
  sellable.forEach(mi=>(mi.recipe||[]).forEach(r=>{dishOutput[r.componentId]=(dishOutput[r.componentId]||0)+r.qty*N(plan[mi.id]?.servings);}));
  const compCost=cid=>{const spent=totals.expByComponent[cid]||0;const out=dishOutput[cid]||0;return out>0?spent/out:0;};
  const totalUnits=sellable.reduce((a,mi)=>a+N(plan[mi.id]?.servings),0);
  const genPerUnit=totalUnits>0?totals.generalExp/totalUnits:0;
  const itemCost=mi=>(mi.recipe||[]).reduce((a,r)=>a+compCost(r.componentId)*r.qty,0)+genPerUnit;
  const projRevenue=sellable.reduce((a,mi)=>a+N(plan[mi.id]?.price)*N(plan[mi.id]?.servings),0);
  const projProfit=projRevenue-totals.totalExpenses;
  const shortfall=N(target)-projProfit;
  const autoScale=()=>{ if(projRevenue<=0) return;
    const k=(N(target)+totals.totalExpenses)/projRevenue; const next={...plan};
    sellable.forEach(mi=>{next[mi.id]={...next[mi.id],servings:Math.ceil(N(next[mi.id]?.servings)*k)};}); setPlan(next); };
  const savePlan=()=>run(async()=>{
    await dbErr(sb.from("settings").update({target_profit:N(target)}).eq("id",1));
    for(const mi of sellable){
      await dbErr(sb.from("menu_items").update({price:N(plan[mi.id]?.price),plan_servings:N(plan[mi.id]?.servings)}).eq("id",mi.id));
    }
  },"Couldn't save plan");

  return <div>
    <div className="note">Enter target profit and planned price + servings per item. Expenses so far: <b>${fmt(totals.totalExpenses)}</b>.</div>
    <div className="field"><label className="fLabel">Target profit for the event</label>
      <div className="amountWrap"><span>$</span><input type="number" inputMode="decimal" value={target} onChange={e=>setTarget(e.target.value)}/></div></div>
    {sellable.map(mi=><div key={mi.id} className="item" style={{flexWrap:"wrap"}}>
      <div className="iMain" style={{flex:"1 1 140px",minWidth:120}}>
        <div className="iTitle">{mi.name}</div><div className="iSub">cost/serving ≈ ${fmt(itemCost(mi))}</div></div>
      <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <div><label className="tiny">Price</label>
          <input className="input mono" style={{width:80}} type="number" step="0.5" min="0"
            value={plan[mi.id]?.price??0} onChange={e=>setPlan({...plan,[mi.id]:{...plan[mi.id],price:e.target.value}})}/></div>
        <div><label className="tiny">Servings</label>
          <input className="input mono" style={{width:80}} type="number" min="0"
            value={plan[mi.id]?.servings??0} onChange={e=>setPlan({...plan,[mi.id]:{...plan[mi.id],servings:e.target.value}})}/></div>
      </div></div>)}
    <div className="receipt" style={{marginTop:14}}>
      <div className="rRow"><span className="rLabel">Projected revenue</span><span className="rNum" style={{color:"var(--sage)"}}>${fmt(projRevenue)}</span></div>
      <div className="rRow"><span className="rLabel">Projected profit</span>
        <span className="rNum" style={{color:projProfit>=0?"var(--sage)":"var(--rust)"}}>{projProfit>=0?"$":"-$"}{fmt(Math.abs(projProfit))}</span></div>
      {N(target)>0&&<div className="rRow"><span className="rLabel">{shortfall>0?"Shortfall vs target":"Above target by"}</span>
        <span className="rNum" style={{color:shortfall>0?"var(--rust)":"var(--sage)"}}>${fmt(Math.abs(shortfall))}</span></div>}
    </div>
    <div style={{display:"flex",gap:8,marginTop:10}}>
      <button className="payBtn" style={{background:"var(--gold)"}} onClick={autoScale}>Scale servings to hit target</button>
      <button className="payBtn" style={{background:"var(--ink)"}} onClick={savePlan}>Save prices & plan</button>
    </div>
    {Object.keys(dishOutput).length>0&&<>
      <div className="secLabel">Cooking assignment (from planned servings)</div>
      <div className="tableCard">{data.components.filter(c=>dishOutput[c.id]).map(c=>
        <div key={c.id} className="tRow"><span>{c.name}</span><span className="mono">{dishOutput[c.id]} servings</span></div>)}</div>
    </>}
  </div>;
}

function AdminSettings(props){
  const {data,run}=props;
  const [editMember,setEditMember]=useState(null);
  const [cashierPin,setCashierPin]=useState(data.settings.cashier_pin||"");
  const qrRef=useRef(null);
  const saveMember=m=>run(async()=>{
    if(m.id) await dbErr(sb.from("members").update({name:m.name,pin:m.pin}).eq("id",m.id));
    else await dbErr(sb.from("members").insert({name:m.name,pin:m.pin}));
  },"Couldn't save member").then(ok=>ok&&setEditMember(null));
  const deleteMember=id=>run(()=>dbErr(sb.from("members").delete().eq("id",id)),"Couldn't delete");
  const saveCashierPin=()=>run(()=>dbErr(sb.from("settings").update({cashier_pin:cashierPin.trim()}).eq("id",1)),"Couldn't save PIN");
  const pickQr=async e=>{const f=e.target.files?.[0]; if(!f) return;
    try{ const img=await compressImage(f,600);
      await run(()=>dbErr(sb.from("settings").update({zelle_qr:img}).eq("id",1)),"Couldn't save QR"); }catch(_){}};
  const removeQr=()=>run(()=>dbErr(sb.from("settings").update({zelle_qr:null}).eq("id",1)),"Couldn't remove QR");

  return <div>
    <div className="listHead"><span className="listTitle">🧑‍🤝‍🧑 Members & PINs</span>
      <button className="btn gold" onClick={()=>setEditMember({})}>＋ Add member</button></div>
    <div className="note">Give each member the app link and their PIN. Everything they enter records to their name.</div>
    {data.members.map(m=><div key={m.id} className="item">
      <div className="iMain"><div className="iTitle">{m.name}</div><div className="iSub">PIN: {m.pin}</div></div>
      <div className="iRight"><button className="smallBtn" onClick={()=>setEditMember(m)}>Edit</button>
        <button className="iconBtn" onClick={()=>deleteMember(m.id)}>🗑️</button></div></div>)}
    <div className="secLabel">Cashier PIN</div>
    <div style={{display:"flex",gap:8}}>
      <input className="input" style={{flex:1}} value={cashierPin} onChange={e=>setCashierPin(e.target.value)} placeholder="e.g. 2468"/>
      <button className="btn ink" onClick={saveCashierPin}>Save</button></div>
    <div className="secLabel">Zelle QR code</div>
    <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      {data.settings.zelle_qr?<img src={data.settings.zelle_qr} alt="Zelle QR" style={{width:110,borderRadius:10,border:"1px solid var(--line)"}}/>:<span className="empty">None uploaded.</span>}
      <button className="smallBtn" onClick={()=>qrRef.current?.click()}>📷 {data.settings.zelle_qr?"Replace":"Upload"}</button>
      {data.settings.zelle_qr&&<button className="smallBtn" onClick={removeQr}>Remove</button>}
      <input ref={qrRef} type="file" accept="image/*" style={{display:"none"}} onChange={pickQr}/></div>
    {editMember&&<MemberEditModal member={editMember.id?editMember:null} onClose={()=>setEditMember(null)} onSave={saveMember}/>}
  </div>;
}
function MemberEditModal({member,onClose,onSave}){
  const [name,setName]=useState(member?.name||"");
  const [pin,setPin]=useState(member?.pin||String(Math.floor(1000+Math.random()*9000)));
  const valid=name.trim()&&pin.trim().length>=4;
  return <Modal title={member?"Edit member":"Add member"} color="var(--gold)" onClose={onClose}>
    <div className="field"><label className="fLabel">Name</label>
      <input className="input" value={name} onChange={e=>setName(e.target.value)} autoFocus/></div>
    <div className="field"><label className="fLabel">PIN (share with them)</label>
      <input className="input" value={pin} onChange={e=>setPin(e.target.value)}/></div>
    <button className="submit" style={{background:"var(--gold)",opacity:valid?1:.5}} disabled={!valid}
      onClick={()=>onSave({id:member?.id,name:name.trim(),pin:pin.trim()})}>Save member</button>
  </Modal>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
